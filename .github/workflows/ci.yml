name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.x'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Code generation (Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Theme regression smoke
        run: flutter test test/widget/core/theme/app_theme_test.dart

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: analyze-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Code generation (Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build mobile app (debug)
        run: flutter build apk --debug

      - name: Build web app
        run: flutter build web --release

      - name: Build admin web app
        run: flutter build web --release --target=lib/main_admin.dart
