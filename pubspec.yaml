name: tasima_app
description: "Nakliyeciyle yuk vereni aracisiz bulusturan mobil uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.8.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#1B2A4A"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/data/
