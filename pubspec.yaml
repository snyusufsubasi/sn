name: araciyok
description: "Yükveren ile kamyon/tır nakliyecisini aracısız buluşturan Türkiye odaklı yük pazarı."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Config / env
  flutter_dotenv: ^5.2.1

  # Storage / cache
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # Networking helpers
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # UI / UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  pinput: ^5.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

  # Forms / validation
  reactive_forms: ^17.0.1

  # i18n / format
  intl: ^0.20.2

  # Maps & location (Faz 9'da aktif olarak kullanılacak; baştan kurulu)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Push notifications (Faz 7)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.18.0
  logger: ^2.5.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lint
  very_good_analysis: ^7.0.0

  # Code gen
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3

  # Testing
  mocktail: ^1.0.4

  # Assets / splash
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0A0A0A"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0A0A0A"
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
